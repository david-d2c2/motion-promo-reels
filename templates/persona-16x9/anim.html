<html><head><meta charset="utf-8">
<style>

</head><body>
<canvas id="c" width="1920" height="1080"></canvas>
<script src="variacion.js"></script>
<script>
const cv=document.getElementById('c'), ctx=cv.getContext('2d');
const W=1920,H=1080,FPS=30,DUR=27.0;
// ---------- versión (v2): render.js inyecta window.PLAN desde versiones.json (node variar.js). Sin plan = v1.
const VP=VAR.perfil('persona');
const PL=(window.PLAN&&window.PLAN.v===2)?window.PLAN:VP.planBase();
// Paletas. "neon" es la de la v1. Para la marca de la persona, añade la suya en CFG.paletas (mismas claves).
const PALETAS={
  neon: {bg:'#050607',tx:'#FFFAF2',a1:'#10F0FF',a2:'#E85D3F',alerta:'#FF3B3B',glitch:'#FF0050',term:'#0B0F12',carta:'#0E1316',pista:'rgba(255,255,255,0.08)',grano:['rgba(255,255,255,0.05)','rgba(0,0,0,0.12)'],flash:'#FFFAF2'},
  tinta:{bg:'#F3EEE6',tx:'#121212',a1:'#1F4BFF',a2:'#E8452C',alerta:'#D7263D',glitch:'#E8452C',term:'#FFFFFF',carta:'#FFFFFF',pista:'rgba(0,0,0,0.08)',grano:['rgba(255,255,255,0.10)','rgba(0,0,0,0.05)'],flash:'#FFFFFF'},
  lima: {bg:'#0B0B0D',tx:'#F5F5F0',a1:'#C6FF3D',a2:'#8B5CF6',alerta:'#FF4D6D',glitch:'#8B5CF6',term:'#141418',carta:'#141418',pista:'rgba(255,255,255,0.08)',grano:['rgba(255,255,255,0.05)','rgba(0,0,0,0.12)'],flash:'#F5F5F0'},
};
let PAL=PALETAS.neon;
const BG0=()=>PAL.bg;
const al=(hex,a)=>{const h=hex.replace('#','');return `rgba(${parseInt(h.slice(0,2),16)},${parseInt(h.slice(2,4),16)},${parseInt(h.slice(4,6),16)},${a})`};
const DISP='InterLocal, "Inter Display", Inter, "Segoe UI", sans-serif', MONO='"DejaVu Sans Mono", Consolas, "SF Mono", monospace';
window.LOC = window.LOC || 0;
// ================= CONFIGURA AQUÍ TU VÍDEO (datos de ejemplo ficticios) =================
const CFG = {
  archivo: 'PROMO_ALEX_EJEMPLO.mp4',
  nombre: 'Alex Ejemplo',
  iniciales: 'AE',
  web: 'alexejemplo.com',
  ciudad: 'Tu ciudad',
  // homónimos que devuelve el buscador (el gag de apertura). Usa los reales que encuentres.
  homonimos: [
    ['Alex Ejempla', 'futbolista · segunda división', 'casi. sobra una «a»'],
    ['Alexis Ejemplo', 'chef · cocina de autor', 'cocina bien. pero no es'],
    ['Otro Alex Ejemplo', 'dentista · otra ciudad', 'sonríe. pero no es'],
  ],
  eyebrow: 'CONSULTORÍA DIGITAL PARA EMPRESAS',
  titulo: ['DISEÑO', 'CON IA'],
  rol: ['Diseño web, contenidos y automatización', 'para equipos que quieren ir más rápido.'],
  // cifras reales de su web: [prefijo, número o texto, línea 1, línea 2]
  stats: [['+', 80, 'PROYECTOS', 'ENTREGADOS'], ['', 8, 'AÑOS DE', 'EXPERIENCIA'], ['+', 40, 'CLIENTES', 'RECURRENTES'], ['', 'NDA', 'DISCRECIÓN', 'GARANTIZADA']],
  metodo: { nombre: 'MÉTODO PASO', claim: ['Del caos a ', 'un sistema que funciona.'], sub: '4 fases para trabajar con criterio',
    fases: [['P', 'Plan', 'Objetivos y punto de partida'], ['A', 'Arquitectura', 'Estructura antes de producir'], ['S', 'Sistema', 'Plantillas, flujos y criterios'], ['O', 'Operación', 'Producción, medición e iteración']] },
  // stack en 3 filas; el PRIMER elemento de la primera fila es el que se congela con el guiño autorreferencial
  stack: [
    ['Claude', 'Figma', 'WordPress', 'n8n', 'Notion', 'Canva', 'Cursor', 'GitHub', 'Vercel', 'Webflow', 'Make'],
    ['Midjourney', 'Runway', 'ElevenLabs', 'CapCut', 'Premiere', 'After Effects', 'Photoshop', 'Lightroom', 'Krea', 'Suno'],
    ['Google Analytics', 'Search Console', 'Semrush', 'Ahrefs', 'Mailchimp', 'HubSpot', 'Stripe', 'Shopify', 'WooCommerce', 'Zapier'],
  ],
  yo: ['↑ ese soy yo.', 'el que está montando este vídeo. hola.'],
  frase: ['LA HERRAMIENTA AYUDA,', 'PERO EL CRITERIO DECIDE.'],
  claim: 'DISEÑO · CONTENIDOS · AUTOMATIZACIÓN',
  cta2: 'Respuesta en < 48 h',
  credito: 'render: Claude  ·  criterio: humano',
  // Textos fijos de la interfaz. Cambia los que necesites (por ejemplo, a inglés o a «NO ES ELLA»).
  textos: {},
};
const UI = Object.assign({
  hud: 'canvas 2D · 1920×1080 · 30 fps · 0 plantillas', rec: 'REC', buscando: 'buscando en internet…',
  resultados: '> resultados: {n}', no_es: '✕ NO ES ÉL', cero_de: '0 de {n}. Toca ir a la fuente.', fuente: '✓ FUENTE ENCONTRADA',
  datos_web: '// datos sacados de su web, no de mi imaginación', verificado: '✓ verificado · 0 datos inventados',
  stack: 'STACK EN SU WEB: {n} HERRAMIENTAS.', contado: 'las he contado. dos veces.', este_video: 'ESTE VÍDEO:',
  filas: ['PLANTILLAS', 'AFTER EFFECTS', 'LÍNEAS DE CÓDIGO', 'IAS IMPLICADAS'],
}, CFG.textos);
// =========================================================================================
Object.assign(PALETAS, CFG.paletas || {});
PAL=PALETAS[PL.paleta]||PALETAS.neon;
const BG=PAL.bg,TX=PAL.tx,CY=PAL.a1,CO=PAL.a2,RED=PAL.alerta;


// ---------- helpers
const cl=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const P=(t,a,b)=>cl((t-a)/(b-a));
const lerp=(a,b,k)=>a+(b-a)*k;
const eOC=k=>1-Math.pow(1-k,3);
const eIOC=k=>k<.5?4*k*k*k:1-Math.pow(-2*k+2,3)/2;
const eOX=k=>k>=1?1:1-Math.pow(2,-10*k);
const eIX=k=>k<=0?0:Math.pow(2,10*k-10);
const eOB=k=>{const c1=2.2,c3=c1+1;return 1+c3*Math.pow(k-1,3)+c1*Math.pow(k-1,2)};
const hash=n=>{const x=Math.sin(n*12.9898+78.233)*43758.5453;return x-Math.floor(x)};
const GL='ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789#$%&@*';

function font(size,w=900,f=DISP){ctx.font=`${w} ${size}px ${f}`}
function T(s,x,y,size,o={}){
  ctx.save();
  font(size,o.w??900,o.f??DISP);
  ctx.letterSpacing=(o.ls??0)+'px';
  ctx.fillStyle=o.c??TX; ctx.globalAlpha*= (o.a??1);
  ctx.textAlign=o.al??'left'; ctx.textBaseline=o.b??'alphabetic';
  ctx.fillText(s,x,y);
  const m=ctx.measureText(s).width;
  ctx.restore(); return m;
}
function MW(s,size,w=900,f=DISP,ls=0){ctx.save();font(size,w,f);ctx.letterSpacing=ls+'px';const m=ctx.measureText(s).width;ctx.restore();return m}
function rr(x,y,w,h,r){ctx.beginPath();ctx.roundRect(x,y,w,h,r)}
function scramble(s,k,seed){ // k 0..1 resolved fraction
  let o='';for(let i=0;i<s.length;i++){
    if(s[i]===' '||i/s.length<k) o+=s[i];
    else o+=GL[Math.floor(hash(seed+i*7.3+Math.floor(k*40))*GL.length)];
  } return o;
}

// impulses for camera shake (time, strength)
const IMP=[[5.1,26],[6.04,16],[6.27,14],[11.82,7],[12.1,7],[12.38,7],[12.66,7],[12.94,7],[16.75,10],[20.6,10],[21.1,12],[22.6,14],[23.0,20],[24.1,6]];
function shake(t){let a=0;for(const [c,s] of IMP){if(t>=c)a+=s*Math.exp(-(t-c)*9)}
  // pre-drop tension
  if(t>4.3&&t<5.1)a+=P(t,4.3,5.1)*9;
  return a}

// ---------- background
function bg(t){
  ctx.fillStyle=BG;ctx.fillRect(0,0,W,H);
  if(PL.fondo==='limpio')return;
  ctx.save();
  if(PL.fondo==='puntos'){ // retícula de puntos que deriva en diagonal
    ctx.fillStyle=al(TX,0.08);const o=(t*10)%48;
    for(let y=-48+o;y<H+48;y+=48)for(let x=-48+o;x<W+48;x+=48){ctx.beginPath();ctx.arc(x,y,1.8,0,7);ctx.fill()}
  }else{ // v1: líneas verticales que se desplazan
    ctx.strokeStyle=al(TX,0.045);ctx.lineWidth=1;const off=(t*14)%160;
    for(let x=-160+off;x<W+160;x+=160){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke()}
  }
  ctx.restore();
}
function grain(f){
  ctx.save();
  for(let i=0;i<700;i++){const x=hash(f*1.7+i*3.1)*W,y=hash(f*2.3+i*5.7)*H;
    ctx.fillStyle=hash(i+f)>.5?PAL.grano[0]:PAL.grano[1];ctx.fillRect(x,y,2,2)}
  ctx.restore();
}

// ---------- HUD (self-referential)
function hud(t,f){
  let a=0.55; if(t>22.6)a*=1-P(t,22.6,23.0);
  if(a<=0)return;
  const s=Math.floor(t),fr=f%FPS;
  const tc=`00:00:${String(s).padStart(2,'0')}:${String(fr).padStart(2,'0')}`;
  T(CFG.archivo,56,62,20,{f:MONO,w:400,a,ls:1});
  T(`${tc}  ·  F ${String(f).padStart(3,'0')}/${Math.round(DUR*FPS)}`,W-56,62,20,{f:MONO,w:400,a,al:'right',ls:1});
  T(UI.hud,56,H-48,18,{f:MONO,w:400,a:a*0.8,ls:1});
  if(Math.floor(t*2)%2===0){ctx.save();ctx.globalAlpha=a;ctx.fillStyle=RED;ctx.beginPath();ctx.arc(W-150,H-54,7,0,7);ctx.fill();ctx.restore()}
  T(UI.rec,W-56,H-48,18,{f:MONO,w:700,a,al:'right',ls:2});
  // progress hairline
  ctx.save();ctx.globalAlpha=a;ctx.fillStyle=CY;ctx.fillRect(0,H-3,W*t/DUR,3);ctx.restore();
}

// ---------- S1 terminal 0-2.2
const CMD=`investigar("${CFG.nombre}")`;
function s1(t){
  const z=1+0.06*eIOC(P(t,0,2.2)) + 0.25*eIX(P(t,1.95,2.2));
  const a=1-P(t,2.05,2.2);
  ctx.save();ctx.globalAlpha=a;ctx.translate(W/2,H/2);ctx.scale(z,z);ctx.translate(-W/2,-H/2);
  const bx=W/2-620,by=H/2-190,bw=1240,bh=380;
  const pop=eOB(P(t,0,0.35));
  ctx.save();ctx.translate(W/2,H/2);ctx.scale(lerp(0.85,1,pop),lerp(0.85,1,pop));ctx.translate(-W/2,-H/2);
  rr(bx,by,bw,bh,22);ctx.fillStyle=PAL.term;ctx.fill();ctx.strokeStyle=al(CY,0.35);ctx.lineWidth=2;ctx.stroke();
  [CO,'#F2C14E',CY].forEach((c,i)=>{ctx.fillStyle=c;ctx.beginPath();ctx.arc(bx+40+i*30,by+36,8,0,7);ctx.fill()});
  T('claude@estudio: ~/promo',bx+bw/2,by+43,20,{f:MONO,w:400,a:.5,al:'center'});
  const n=Math.floor(cl((t-0.25)/1.3)*CMD.length);
  let x=bx+60,y=by+150;
  x+=T('> ',x,y,46,{f:MONO,w:700,c:CY});
  const w=T(CMD.slice(0,n),x,y,46,{f:MONO,w:400});
  if(t<1.7&&Math.floor(t*4)%2===0){ctx.fillStyle=TX;ctx.fillRect(x+w+4,y-38,24,46)}
  if(t>=1.7){
    T(UI.buscando,bx+60,by+235,34,{f:MONO,w:400,c:al(TX,0.7)});
    const k=eOC(P(t,1.75,2.15));
    rr(bx+60,by+275,bw-120,14,7);ctx.fillStyle=PAL.pista;ctx.fill();
    rr(bx+60,by+275,(bw-120)*k,14,7);ctx.fillStyle=CY;ctx.fill();
  }
  ctx.restore();ctx.restore();
}

// ---------- S2 wrong results 2.2-5.1
const WRONG=CFG.homonimos;
function s2(t){
  const u=t-2.2;
  // RGB glitch amount
  const g=(u>1.9&&u<2.35)?1:(u>2.1&&u<2.9?P(u,2.1,2.9):0);
  T(UI.resultados.replace('{n}',WRONG.length),W/2-640,200,30,{f:MONO,w:400,c:CY,a:P(u,0,.15)});
  WRONG.forEach((c,i)=>{
    const st=0.15+i*0.4, k=eOX(P(u,st,st+0.45));
    if(u<st)return;
    const y=250+i*190, x=lerp(W+200,W/2-640,k);
    ctx.save();ctx.translate(x,y);ctx.transform(1,0,lerp(-0.25,0,k),1,0,0);
    rr(0,0,1280,160,18);ctx.fillStyle=PAL.carta;ctx.fill();ctx.strokeStyle=al(TX,0.12);ctx.lineWidth=2;ctx.stroke();
    T(c[0],44,78,60,{w:900});
    T(c[1],44,128,28,{f:MONO,w:400,a:.65});
    const sk=eOC(P(u,st+0.42,st+0.62));
    if(sk>0){
      ctx.strokeStyle=RED;ctx.lineWidth=8;ctx.beginPath();ctx.moveTo(30,62);ctx.lineTo(30+sk*(MW(c[0],60)+40),58);ctx.stroke();
      const sp=eOB(P(u,st+0.5,st+0.75));
      ctx.save();ctx.translate(1110,80);ctx.rotate(-0.12);ctx.scale(sp*1.0,sp*1.0);
      rr(-130,-36,260,72,10);ctx.strokeStyle=RED;ctx.lineWidth=5;ctx.stroke();
      T(UI.no_es,0,13,34,{c:RED,al:'center',w:900});
      ctx.restore();
      T(c[2],44+MW(c[1],28,400,MONO)+40,128,26,{f:MONO,w:400,c:CO,a:P(u,st+0.6,st+0.8)});
    }
    ctx.restore();
  });
  if(u>1.9){
    const k=eOX(P(u,1.9,2.2));
    const msg=UI.cero_de.replace('{n}',WRONG.length);
    const y=900;
    if(g>0){
      T(msg,W/2-8*g,y,64,{c:al(PAL.glitch,0.8),al:'center'});
      T(msg,W/2+8*g,y,64,{c:al(CY,0.8),al:'center'});
    }
    T(scramble(msg,k,3),W/2,y,64,{al:'center'});
  }
  // glitch slices
  if(g>0){
    for(let i=0;i<10;i++){const sy=hash(Math.floor(t*30)*3+i)*H,sh=10+hash(i*9+t)*50,dx=(hash(i+Math.floor(t*30))-.5)*120*g;
      ctx.drawImage(cv,0,sy,W,sh,dx,sy,W,sh)}
  }
  // cyan circle wipe
  if(u>2.55){const k=eIX(P(u,2.55,2.9));ctx.fillStyle=CY;ctx.beginPath();ctx.arc(W/2,H/2,k*1200,0,7);ctx.fill()}
}

// ---------- S3 found 5.1-7.6
function s3(t){
  const u=t-5.1;
  // circles from site
  const kc=eOB(P(u,0.0,0.55)),kc2=eOB(P(u,0.1,0.65));
  const exit=eIX(P(u,2.15,2.5));
  ctx.fillStyle=CO;ctx.beginPath();ctx.arc(70,40,330*kc*(1-exit)+0.01,0,7);ctx.fill();
  ctx.fillStyle=CY;ctx.beginPath();ctx.arc(1860,1060,300*kc2*(1-exit)+0.01,0,7);ctx.fill();
  // collapsing cyan wipe from s2
  if(u<0.3){const k=1-eOC(P(u,0,0.3));ctx.fillStyle=CY;ctx.beginPath();ctx.arc(W/2,H/2,k*1200,0,7);ctx.fill()}
  ctx.save();ctx.translate(0,-exit*140);ctx.globalAlpha=1-exit;
  // stamp
  if(u>0.1){
    const sk=eOB(P(u,0.1,0.35));
    ctx.save();ctx.translate(280,250);ctx.scale(sk,sk);
    rr(0,-34,330,48,8);ctx.fillStyle=CY;ctx.fill();
    T(UI.fuente,16,0,22,{f:MONO,w:700,c:BG,ls:1});ctx.restore();
    const url=CFG.web+' · '+CFG.ciudad;const n=Math.floor(cl((u-0.2)/0.55)*url.length);
    T(url.slice(0,n)+(u<0.8&&Math.floor(u*6)%2?'▌':''),640,250,34,{f:MONO,w:400});
  }
  T(CFG.eyebrow,284,318,24,{w:800,c:CY,ls:5,a:P(u,0.5,0.8)});
  titular(u);
  if(u>1.55){
    const k=eOC(P(u,1.55,1.9));
    ctx.save();ctx.globalAlpha*=k;ctx.translate(lerp(-40,0,k),0);
    T(CFG.rol[0],284,935,34,{w:600});
    T(CFG.rol[1],284,982,34,{w:600});
    ctx.restore();
  }
  ctx.restore();
}

// titular de la escena «fuente encontrada»: golpe (v1) · mascara · maquina. Los instantes clave (0,94 s y 1,17 s) no cambian.
function titular(u){
  const L0=CFG.titulo[0],L1=CFG.titulo[1];
  if(PL.titulo==='mascara'){
    if(u>0.94){const k=eOX(P(u,0.94,1.3));ctx.save();ctx.beginPath();ctx.rect(0,360,W,262);ctx.clip();T(L0,270,lerp(880,600,k),270,{ls:-6});ctx.restore()}
    if(u>1.17){const k=eOX(P(u,1.17,1.5)),w=MW(L1,270,900,DISP,-6);
      ctx.save();ctx.fillStyle=CY;ctx.globalAlpha=0.9;ctx.fillRect(250,858,(w+40)*eOC(P(u,1.3,1.7)),22);ctx.restore();
      ctx.save();ctx.beginPath();ctx.rect(0,620,W,260);ctx.clip();T(L1,270,lerp(1120,850,k),270,{ls:-6});ctx.restore()}
  }else if(PL.titulo==='maquina'){ // máquina de escribir: letra a letra, con cursor
    const n0=Math.floor(cl((u-0.94)/0.045,0,L0.length)),n1=Math.floor(cl((u-1.17-L0.length*0.02)/0.045,0,L1.length));
    if(u>0.94){T(L0.slice(0,n0),270,600,270,{ls:-6})}
    if(n1>0)T(L1.slice(0,n1),270,850,270,{ls:-6});
    if(u>0.94&&u<2.3&&Math.floor(u*5)%2===0){const line=n1>0||n0>=L0.length?1:0,txt=line?L1.slice(0,n1):L0.slice(0,n0);
      ctx.fillStyle=CY;ctx.fillRect(270+MW(txt,270,900,DISP,-6)+14,(line?850:600)-200,26,210)}
  }else{ // golpe (v1)
    if(u>0.94){const k=eOX(P(u,0.94,1.15));const s=lerp(1.7,1,k);
      ctx.save();ctx.translate(270,600);ctx.scale(s,s);T(L0,0,0,270,{a:k,ls:-6});ctx.restore()}
    if(u>1.17){const k=eOX(P(u,1.17,1.5));
      ctx.save();ctx.beginPath();ctx.rect(0,620,W,260);ctx.clip();T(L1,270,lerp(1120,850,k),270,{ls:-6});ctx.restore()}
  }
}

// ---------- S4 stats 7.6-11.4
const STATS=CFG.stats;
const valor=(s,u,st)=>typeof s[1]==='number'?s[0]+Math.round(s[1]*eOC(P(u,st,st+0.9))):scramble(s[1],P(u,st,st+0.8),11);
// cifras: columnas (v1) · foco (una a una, a pantalla completa) · rejilla 2×2
function s4(t){
  const u=t-7.6;
  T(UI.datos_web,150,230,26,{f:MONO,w:400,c:CY,a:P(u,0,0.25)});
  if(PL.cifras==='foco')cifrasFoco(u);else if(PL.cifras==='rejilla')cifrasRejilla(u);else cifrasColumnas(u);
  if(u>2.9){const k=eOB(P(u,2.9,3.15));
    ctx.save();ctx.translate(150,PL.cifras==='rejilla'?960:860);ctx.scale(k,k);
    rr(0,-40,620,58,29);ctx.strokeStyle=CY;ctx.lineWidth=2;ctx.stroke();
    T(UI.verificado,28,-1,26,{f:MONO,w:400,c:CY});ctx.restore()}
  // coral wipe out
  if(u>3.45){const k=eIOC(P(u,3.45,3.8));ctx.fillStyle=CO;ctx.fillRect(0,0,W*k,H)}
}
function cifrasFoco(u){ // cada cifra ocupa la pantalla 0,7 s; al final, las cuatro en fila
  STATS.forEach((s,i)=>{const st=0.1+i*0.7,en=eOX(P(u,st,st+0.35)),sa=eIX(P(u,st+0.62,st+0.82));
    if(u<st||sa>=1||u>2.95)return;
    ctx.save();ctx.globalAlpha=en*(1-sa);ctx.translate(lerp(160,0,en)-sa*200,0);
    ctx.fillStyle=i%2?CO:CY;ctx.fillRect(W/2-180,350,360*eOC(P(u,st+0.1,st+0.5)),8);
    T(valor(s,u,st),W/2,640,300,{al:'center',ls:-8});
    T(s[2]+' '+s[3],W/2,730,34,{w:800,ls:5,a:.85,al:'center'});ctx.restore()});
  if(u>2.85){const k=eOX(P(u,2.85,3.2));
    STATS.forEach((s,i)=>{const x=150+i*430;ctx.save();ctx.globalAlpha=k;ctx.translate(0,lerp(40,0,k));
      ctx.fillStyle=i%2?CO:CY;ctx.fillRect(x,450,300,6);T(valor(s,99,0),x-2,580,110,{ls:-4});

// ---------- S5 método 11.4-15.2
const FASES=CFG.metodo.fases;
function s5(t){

  if(PL.metodo==='linea')metodoLinea(u,ex,activa);else if(PL.metodo==='escalera')metodoEscalera(u,ex,activa);

    const kl=eOC(P(u,st+0.25,st+0.55));
    ctx.save();ctx.globalAlpha=kl*(1-ex);

  });
  if(u>2.35){

    const pre=CFG.metodo.claim[0],hi=CFG.metodo.claim[1];
    const w1=MW(pre,52,800);

    ctx.fillStyle=CY;ctx.fillRect(150+w1-8,852,(MW(hi,52,800)+16)*eOC(P(u,2.5,2.85)),64);
    T(hi,150+w1,900,52,{w:800,c:P(u,2.6,2.7)>0.5?BG:TX,a:k});

  }
  // coral panel leaving at start
  if(u<0.35){const k=eIOC(P(u,0,0.35));ctx.fillStyle=CO;ctx.fillRect(W*k,0,W*(1-k),H)}
}

// método como línea de tiempo: la línea se traza y cada fase es un nodo (mismos instantes que la v1)
function metodoLinea(u,ex,activa){
  const n=FASES.length,x0=210,x1=W-210,y=470,kl=eIOC(P(u,0.1,1.3));

    const k=eOB(P(u,st,st+0.35)),on=activa(i);

}
// método como escalera: cada fase es un peldaño más alto que el anterior
function metodoEscalera(u,ex,activa){

// ---------- S6 stack 15.2-18.9
const ROWS=CFG.stack;
const FZ=1.6, FZE=2.8; // freeze window (local)
function vel(u){
  if(u<1.15)return 2600*eIOC(u/1.15);
  if(u<FZ)return 2600*(1-eOC((u-1.15)/(FZ-1.15)));
  if(u<FZE)return 0;
  return 4200*eIX(P(u,FZE,3.7));
}
function pos(u){let s=0;const dt=1/240;for(let x=0;x<u;x+=dt)s+=vel(x)*dt;return s}
const SF=pos(FZ);
function pillW(s){return MW(s,54,800)+80}
// stack en cuadrícula: las herramientas aparecen en desorden y, en el mismo instante que la marquesina, todas se apagan
// menos la primera ("↑ ese soy yo")
function stackCuadricula(u,fz,ent){
  const items=CFG.stack.flat(),sz=40,h=72,gap=18,lh=94,x0=150,maxW=W-300;
  const ord=items.map((_,i)=>i).sort((a,b)=>hash(a*3.7+1)-hash(b*3.7+1)),rank=[];ord.forEach((v,j)=>rank[v]=j);
  let x=x0,y=330,rect=null;
  items.forEach((name,i)=>{const w=MW(name,sz,800)+56;if(x+w>x0+maxW){x=x0;y+=lh}
    const st=0.15+rank[i]*0.03,k=eOB(P(u,st,st+0.3)),isC=i===0;
    if(k>0){ctx.save();ctx.globalAlpha=cl(k)*(fz&&!isC?0.22:1)*ent;ctx.translate(x+w/2,y);ctx.scale(cl(k,0,1.2),cl(k,0,1.2));
      rr(-w/2,-h/2-14,w,h,h/2);if(isC&&fz){ctx.fillStyle=CY;ctx.fill()}else{ctx.strokeStyle=al(TX,0.45);ctx.lineWidth=2;ctx.stroke()}
      T(name,-w/2+28,8,sz,{w:800,c:isC&&fz?BG:TX});ctx.restore()}
    if(isC)rect=[x,y-h/2-14,w,h];x+=w+gap});
  return rect;
}
function s6(t){
  const u=t-15.2;
  const s=pos(u),v=vel(u);
  const fz=u>=FZ-0.05&&u<FZE;
  const ent=eOX(P(u,0,0.4));
  T(UI.stack.replace('{n}',new Set(CFG.stack.flat()).size),150,180,34,{w:900,ls:2,a:ent});
  T(UI.contado,150,226,26,{f:MONO,w:400,c:CY,a:P(u,0.3,0.5)});
  let claudeRect=null;
  if(PL.stack==='cuadricula')claudeRect=stackCuadricula(u,fz,ent);
  else ROWS.forEach((row,r)=>{
    const ws=row.map(pillW),gap=28;const per=ws.reduce((a,b)=>a+b+gap,0);
    const dir=r%2?1:-1;const y=380+r*170;
    // phase so Claude (row0 idx0) is centered at freeze
    const phase=r===0?(W/2-ws[0]/2+SF):r*517;
    let base=(dir<0?phase-s*(r===0?1:1.1):-phase+s*(r===1?0.9:1.2)+r*300);
    base=((base%per)+per)%per-per;
    for(let rep=0;rep<4;rep++){
      let x=base+rep*per;
      row.forEach((name,i)=>{
        const w=ws[i];
        if(x+w>-200&&x<W+200){
          const isC=r===0&&i===0;
          const dim=fz&&!isC?0.22:1;
          // motion trail
          const blur=Math.min(v/2600,1.5);
          for(let g=2;g>=0;g--){
            if(g>0&&blur<0.25)continue;
            const gx=x-dir*g*blur*22;
            ctx.save();ctx.globalAlpha=(g===0?1:0.09)*dim*ent;
            rr(gx,y-60,w,90,45);
            if(isC&&fz){ctx.fillStyle=CY;ctx.fill()}else{ctx.strokeStyle=al(TX,0.45);ctx.lineWidth=2;ctx.stroke()}
            T(name,gx+40,y+5,54,{w:800,c:isC&&fz?BG:TX});
            ctx.restore();
          }
          if(isC&&x>0&&x<W)claudeRect=[x,y-60,w,90];
        }
        x+=w+gap;
      });
    }
  });
  if(fz&&claudeRect){
    const k=eOB(P(u,FZ,FZ+0.3));
    const [x,y,w,h]=claudeRect;
    const lx=Math.min(W-470,Math.max(470,x+w/2)); // el rótulo nunca se sale de pantalla (en la cuadrícula la píldora puede estar en un borde)
    ctx.save();ctx.strokeStyle=CY;ctx.lineWidth=4;
    const pad=14+8*Math.sin(u*14)*(1-P(u,FZ,FZ+0.8));
    rr(x-pad,y-pad,w+pad*2,h+pad*2,60);ctx.globalAlpha=k;ctx.stroke();
    ctx.restore();
    ctx.save();ctx.globalAlpha=k;
    rr(lx-420,y+h+30,840,120,16);ctx.fillStyle=al(BG,0.92);ctx.fill();
    T(CFG.yo[0],lx,y+h+80,44,{w:900,c:CY,al:'center'});
    T(CFG.yo[1],lx,y+h+124,26,{f:MONO,w:400,al:'center',a:P(u,FZ+0.35,FZ+0.55)});
    ctx.restore();
  }
  // exit: speed lines + flash
  if(u>3.5){const k=P(u,3.5,3.7);ctx.fillStyle=al(BG,k);ctx.fillRect(0,0,W,H)}
}

// ---------- S7 self-ref 18.9-22.6
function s7(t){
  const u=t-18.9;
  const sl=eIOC(P(u,1.55,1.9)); // slide list away
  ctx.save();ctx.translate(-sl*W*0.6,0);ctx.globalAlpha=1-sl;

  const rows=[[UI.filas[0],0],[UI.filas[1],0],[UI.filas[2],window.LOC],[UI.filas[3],1]];

    // letter stagger L2

  }
  // iris close
  if(u>3.3){const k=eIOC(P(u,3.3,3.7));
    ctx.save();ctx.fillStyle=BG;ctx.beginPath();ctx.rect(0,0,W,H);ctx.arc(W/2,H/2,Math.max(1,(1-k)*1250),0,7,true);ctx.fill('evenodd');ctx.restore()}
}

// ---------- S8 cierre: aro que se dibuja + iniciales + nombre + llamadas a la acción
// todas las caras (la v1 solo precargaba 400, 700 y 900; 600 y 800 podían salir con la fuente de reserva)
window.READY=Promise.all([...document.fonts].map(f=>f.load().catch(()=>null)));
function s8(t){
  const u=t-22.6;
  const ir=eOX(P(u,0,0.5));
  ctx.save();ctx.beginPath();ctx.arc(W/2,H/2,Math.max(1,ir*1250),0,7);ctx.clip();
  bg(t);
  const kc=eOB(P(u,0.2,0.75)),kc2=eOB(P(u,0.3,0.85));
  ctx.fillStyle=CO;ctx.beginPath();ctx.arc(70,40,300*kc+0.01,0,7);ctx.fill();
  ctx.fillStyle=CY;ctx.beginPath();ctx.arc(1840,1040,330*kc2+0.01,0,7);ctx.fill();
  // monograma
  const kr=eIOC(P(u,0.05,0.6));ctx.save();ctx.strokeStyle=CY;ctx.lineWidth=10;ctx.lineCap='round';ctx.shadowColor=CY;ctx.shadowBlur=30*(1-P(u,0.5,1.4))+6;
  ctx.beginPath();ctx.arc(W/2,262,120,-Math.PI/2,-Math.PI/2+Math.PI*2*kr);ctx.stroke();ctx.restore();
  const ki=eOB(P(u,0.45,0.8));if(ki>0){ctx.save();ctx.translate(W/2,262);ctx.scale(ki,ki);T(CFG.iniciales,0,42,120,{al:'center',ls:-4});ctx.restore()}
  if(u>0.52&&u<0.95){const k=P(u,0.52,0.95);ctx.save();ctx.strokeStyle=CY;ctx.globalAlpha=1-k;ctx.lineWidth=6*(1-k)+1;
    ctx.beginPath();ctx.arc(W/2,262,40+k*420,0,7);ctx.stroke();ctx.restore()}
  const name=CFG.nombre.toUpperCase();
  if(u>0.9){const k=P(u,0.9,1.5);T(scramble(name,k,21),W/2,560,124,{al:'center',ls:-2})}
  T(CFG.claim,W/2,650,30,{w:800,ls:7,al:'center',a:eOC(P(u,1.35,1.7)),c:al(TX,0.85)});
  const b1=eOB(P(u,1.7,2.0)),b2=eOB(P(u,1.85,2.15));
  if(b1>0){ctx.save();ctx.translate(W/2-250,800);ctx.scale(b1,b1);rr(-220,-42,440,84,42);ctx.fillStyle=CY;ctx.fill();
    T(CFG.web,0,13,34,{c:BG,al:'center',w:900});ctx.restore()}
  if(b2>0){ctx.save();ctx.translate(W/2+250,800);ctx.scale(b2,b2);rr(-220,-42,440,84,42);ctx.strokeStyle=TX;ctx.lineWidth=3;ctx.stroke();
    T(CFG.cta2,0,12,32,{al:'center',w:800});ctx.restore()}
  T(CFG.ciudad+'  ·  '+CFG.credito,W/2,940,24,{f:MONO,w:400,al:'center',a:P(u,2.5,2.8)*0.7});
  if(window.VOZ&&window.VOZ.etiqueta)T(window.VOZ.etiqueta,W/2,985,22,{f:MONO,w:400,al:'center',a:P(u,2.6,2.9)*0.7}); // v3: locución sintética
  ctx.restore();
  if(u>4.0){ctx.fillStyle=al(BG,P(u,4.0,4.4));ctx.fillRect(0,0,W,H)}
}

// ---------- master
function renderFrame(f){
  const t=f/FPS;
  ctx.setTransform(1,0,0,1,0,0);
  bg(t);
  const sh=shake(t);
  ctx.save();
  if(sh>0.3)ctx.translate((hash(f*1.1)-.5)*sh,(hash(f*2.7)-.5)*sh);
  if(t<2.2)s1(t);
  else if(t<5.1)s2(t);
  else if(t<7.6)s3(t);
  else if(t<11.4)s4(t);
  else if(t<15.2)s5(t);
  else if(t<18.9)s6(t);
  else if(t<22.6)s7(t);
  else s8(t);
  ctx.restore();
  // flash on drop
  const fl=Math.max(Math.exp(-(t-5.1)*14)*(t>=5.1),Math.exp(-(t-22.6)*10)*(t>=22.6)*0.6);
  if(fl>0.01){ctx.fillStyle=al(PAL.flash,fl);ctx.fillRect(0,0,W,H)}
  hud(t,f);
  grain(f);
}
window.renderFrame=renderFrame;window.TOTAL=Math.round(DUR*FPS);
