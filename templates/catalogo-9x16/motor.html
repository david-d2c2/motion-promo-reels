<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<style>
@font-face{font-family:Play;src:url(fonts/playfair-display-latin-400-normal.woff2);font-weight:400}
@font-face{font-family:Play;src:url(fonts/playfair-display-latin-700-normal.woff2);font-weight:700}
@font-face{font-family:Play;src:url(fonts/playfair-display-latin-800-normal.woff2);font-weight:800}
@font-face{font-family:Play;src:url(fonts/playfair-display-latin-400-italic.woff2);font-weight:400;font-style:italic}
@font-face{font-family:Play;src:url(fonts/playfair-display-latin-700-italic.woff2);font-weight:700;font-style:italic}
@font-face{font-family:Out;src:url(fonts/outfit-latin-400-normal.woff2);font-weight:400}
@font-face{font-family:Out;src:url(fonts/outfit-latin-600-normal.woff2);font-weight:600}
@font-face{font-family:Out;src:url(fonts/outfit-latin-700-normal.woff2);font-weight:700}
@font-face{font-family:Out;src:url(fonts/outfit-latin-800-normal.woff2);font-weight:800}
html,body{margin:0;background:#F8ECE8}canvas{display:block}
</style></head><body>
<canvas id="c" width="1080" height="1920"></canvas>
<script>
/* Motor de reels por producto para catálogos (9:16).
   Estructura común de 6 escenas + un gag por CATEGORÍA (config.json), alimentado con los datos reales de cada producto.
   window.SPEC = {m: marca, p: producto} lo inyecta render.js. */
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
const W=1080,H=1920,FPS=30,DUR=15.5;
const C={blush:'#F8ECE8',ivory:'#FBF6F2',ink:'#0A0A0A',text:'#2B2B2B',nude:'#B89878',cacao:'#8C6A4F',rose:'#D9A5A0',white:'#FFFFFF'};
{const k=(window.SPEC&&SPEC.m.colores)||{};const map={fondo:'blush',fondo_cierre:'ivory',tinta:'ink',texto:'text',acento:'cacao',acento_suave:'nude'};for(const n in map)if(k[n])C[map[n]]=k[n];}
const SERIF='Play, "Playfair Display", Georgia, serif',SANS='Out, Outfit, "Segoe UI", Arial, sans-serif';
const T={hook:0,hero:3.0,talla:5.8,facts:8.8,price:11.4,outro:13.2,end:15.5};

const cl=(x,a=0,b=1)=>Math.min(b,Math.max(a,x)),P=(t,a,b)=>cl((t-a)/(b-a)),lerp=(a,b,k)=>a+(b-a)*k;
const eOC=k=>1-Math.pow(1-k,3),eIOC=k=>k<.5?4*k*k*k:1-Math.pow(-2*k+2,3)/2,eOX=k=>k>=1?1:1-Math.pow(2,-10*k),eIX=k=>k<=0?0:Math.pow(2,10*k-10);
const eOB=k=>{const c1=1.7,c3=c1+1;return 1+c3*Math.pow(k-1,3)+c1*Math.pow(k-1,2)};

function T_(s,x,y,size,o={}){ctx.save();ctx.font=`${o.it?'italic ':''}${o.w??700} ${size}px ${o.f??SERIF}`;
  ctx.letterSpacing=(o.ls??0)+'px';ctx.fillStyle=o.c??C.ink;ctx.globalAlpha*=(o.a??1);ctx.textAlign=o.al??'left';ctx.textBaseline=o.b??'alphabetic';
  ctx.fillText(s,x,y);const m=ctx.measureText(s).width;ctx.restore();return m}
function MW(s,size,o={}){ctx.save();ctx.font=`${o.it?'italic ':''}${o.w??700} ${size}px ${o.f??SERIF}`;ctx.letterSpacing=(o.ls??0)+'px';const m=ctx.measureText(s).width;ctx.restore();return m}
function fit(s,max,size,o={}){let z=size;while(MW(s,z,o)>max&&z>20)z-=2;return z}
function rr(x,y,w,h,r){ctx.beginPath();ctx.roundRect(x,y,w,h,r)}

// nombres de color de la tienda -> muestra. Si no está, gris neutro y se muestra el nombre igual.
const COLORS={'blanco':'#F5F2EC','negro':'#141414','tierra':'#C29A7B','piel':'#D9B79C','nude':'#D9B79C','beige':'#DCC6A8','rosa':'#E7B5B6','rosé':'#E9C6BF','rose':'#E9C6BF',
  'azul marino':'#1E2A44','marino':'#1E2A44','azul':'#3D5A8A','gris':'#9A9A9A','burdeos':'#6B1E2C','granate':'#7A1F2B','rojo':'#B3262F','verde':'#4E6B52','champagne':'#E9D7B9',
  'champán':'#E9D7B9','marfil':'#F3EBDD','crudo':'#EFE6D6','visón':'#A89184','topo':'#8E7F74','malva':'#B48BA6','morado':'#6C4A7D','lila':'#C2A9D1','coral':'#E07A65','turquesa':'#3BAFB0','maquillaje':'#D8B096','alabastro':'#EFE7DC','cava':'#E6D3B3','marrón':'#6B4A35','marron':'#6B4A35','arena':'#D6C2A1','fucsia':'#D0317A','flúor':'#D6F23A','fluor':'#D6F23A'};
const colHex=n=>COLORS[(n||'').toLowerCase().trim()]||'#A9A39C';

// Textos fijos de la interfaz: se pueden cambiar con "textos" en config.json (tienda.textos).
const TX=Object.assign({midiendo:'midiendo este reel…',remate:'Este reel mide 15,5 s.',ia:'Imagen generada con IA',foto:'foto pendiente',
  un_color:'1 color',colores:'{n} colores',datos:'Lo que te aporta',desde:'desde',decimal:','},(window.SPEC&&SPEC.m.textos)||{});
let IMG=null,LOGO=null;
const load=src=>new Promise(r=>{const i=new Image();i.onload=()=>r(i);i.onerror=()=>r(null);i.src=src});
window.READY=(async()=>{await document.fonts.load('700 40px Play');await document.fonts.load('italic 700 40px Play');await document.fonts.load('600 40px Out');
  if(window.SPEC){if(SPEC.p.foto)IMG=await load(SPEC.p.foto);LOGO=await load(SPEC.m.logo)}})();

// ---------- fondo + cinta métrica (autorreferencia: el reel se "mide" mientras avanza)
function bg(c){ctx.fillStyle=c||C.blush;ctx.fillRect(0,0,W,H)}
function kicker(a=1){ctx.save();ctx.globalAlpha=a;T_(SPEC.m.nombre.toUpperCase(),80,250,30,{f:SANS,w:600,ls:9,c:C.cacao});ctx.fillStyle=C.nude;ctx.fillRect(80,272,70,3);ctx.restore()}
function tape(t,f){
  const y=H-170,h=64,k=cl(t/DUR);
  ctx.save();ctx.fillStyle='#F3E2C4';rr(-10,y,W+20,h,6);ctx.fill();ctx.strokeStyle='rgba(140,106,79,.35)';ctx.lineWidth=2;ctx.stroke();
  // la cinta se desplaza: 1 cm = 18 px, recorrido = segundos*10
  const off=k*DUR*10*18;ctx.beginPath();ctx.rect(0,y,W,h);ctx.clip();
  for(let cm=Math.floor(off/18)-2;cm<(off+W)/18+2;cm++){const x=cm*18-off+60;const big=cm%10===0;
    ctx.fillStyle=C.cacao;ctx.fillRect(x,y,2,big?30:(cm%5===0?22:14));
    if(big&&cm>=0)T_(String(cm/10),x+6,y+52,20,{f:SANS,w:600,c:C.cacao})}
  ctx.restore();
  // marcador
  ctx.save();ctx.fillStyle=C.ink;ctx.fillRect(60,y-14,4,h+28);ctx.restore();
  const label=t>DUR-1.2?(SPEC.m.cinta_remate||TX.remate):`${TX.midiendo} ${(t).toFixed(1).replace('.',TX.decimal)} s`;
  T_(label,W-80,y-26,24,{f:SANS,w:600,al:'right',c:C.cacao,a:0.85});
}
function aiLabel(a){ // transparencia (AI Act art. 50) si las fotos llevan personas generadas o modificadas con IA
  ctx.save();ctx.globalAlpha=a;ctx.font=`600 26px ${SANS}`;const s=(SPEC.m.ia&&SPEC.m.ia.texto)||TX.ia;const w=ctx.measureText(s).width+44;
  ctx.fillStyle='rgba(10,10,10,.78)';rr(W/2-w/2,1590,w,52,26);ctx.fill();ctx.fillStyle=C.white;ctx.textAlign='center';ctx.fillText(s,W/2,1625);ctx.restore()}

// ---------- ESCENA 1: gancho por categoría
function hook(t){
  const p=SPEC.p,u=t,L=p.hook,y0=740;
  const line=(i,st,y,o={})=>{if(u<st||!L[i])return;const k=eOX(P(u,st,st+0.4));const sz=fit(L[i],W-160,o.size||96,{it:o.it});
    ctx.save();ctx.globalAlpha=k*(o.a??1);ctx.translate(o.dx||0,lerp(36,0,k)+(o.dy||0));T_(L[i],W/2,y,sz,{al:'center',c:o.c||C.ink,it:o.it});ctx.restore()};
  const g=p.gag;
  if(g==='quitar'){ // dos aros que se dibujan y salen disparados
    line(0,0.1,y0);
    // dos aros que se dibujan y salen disparados
    for(const s of [-1,1]){const kd=eOC(P(u,0.3,0.9)),ko=eIX(P(u,1.05,1.45));const cx=W/2+s*200+s*ko*700,cy=1080-ko*260,r=130;
      ctx.save();ctx.translate(cx,cy);ctx.rotate(s*ko*3);ctx.strokeStyle=C.cacao;ctx.lineWidth=16;ctx.lineCap='round';
      ctx.beginPath();ctx.arc(0,0,r,-Math.PI/2,-Math.PI/2+Math.PI*2*kd);ctx.stroke();ctx.restore()}
    line(1,1.1,y0+140,{c:C.cacao,size:110});line(2,1.9,1300,{it:1,size:78});
  }else if(g==='secuencia'){ // las variantes reales pasan una a una
    line(0,0.1,y0);
    const cops=p.variantes.length?p.variantes:['—'];const n=cops.length;const i=Math.min(n-1,Math.floor(P(u,0.9,2.0)*n));
    if(u>0.9){const kk=eOB(P(u,0.9+i*1.1/n,0.9+(i+0.6)*1.1/n));ctx.save();ctx.translate(W/2,1110);ctx.scale(kk,kk);
      T_(cops[i],0,0,300,{al:'center',c:C.cacao,w:800});ctx.restore();
      cops.forEach((c,j)=>T_(c,W/2+(j-(n-1)/2)*90,1230,52,{f:SANS,w:700,al:'center',c:j<=i?C.ink:'rgba(10,10,10,.2)'}))}
    line(1,2.1,1380,{it:1,size:82});
  }else if(g==='cortar'){
    const cut=eIX(P(u,0.95,1.25));
    // dos hilos sujetan el texto... y se cortan
    for(const s of [-1,1]){ctx.save();ctx.strokeStyle=C.cacao;ctx.lineWidth=6;ctx.globalAlpha=P(u,0.1,0.4);const x=W/2+s*300;
      ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,lerp(y0-70,-40,cut));ctx.stroke();ctx.restore()}
    const settle=u>1.25?Math.sin((u-1.25)*14)*10*Math.exp(-(u-1.25)*5):0;
    line(0,0.1,y0,{dy:settle});line(1,1.35,y0+150,{c:C.cacao});line(2,2.0,1300,{it:1,size:80});
  }else if(g==='elevar'){
    const lift=eOB(P(u,0.9,1.4));
    ctx.save();ctx.globalAlpha=0.5*P(u,0.6,0.9)*(1-P(u,1.4,1.8));ctx.fillStyle=C.nude;ctx.beginPath();ctx.ellipse(W/2,y0+40-lift*10,lerp(260,380,lift),lerp(12,40,lift),0,0,7);ctx.fill();ctx.restore();
    line(0,0.1,y0-lift*90,{size:lerp(96,104,lift)});line(1,1.5,y0+200,{c:C.cacao});line(2,2.1,1300,{it:1,size:82});
  }else if(g==='ritmo'){
    const words=(L[0]||'').split(' ');let x=0;const sz=fit(L[0],W-160,100);const tw=MW(L[0],sz);x=W/2-tw/2;
    words.forEach((w,i)=>{const st=0.1+i*(60/112/1)*0.5,k=eOB(P(u,st,st+0.2));ctx.save();ctx.translate(x+MW(w,sz)/2,y0);ctx.scale(k,k);T_(w,0,0,sz,{al:'center'});ctx.restore();x+=MW(w+' ',sz)});
    line(1,1.3,y0+150,{c:C.cacao,size:110});line(2,2.0,1300,{it:1,size:80});
  }else if(g==='reordenar'){
    const k=eIOC(P(u,0.9,1.5));line(0,0.1,y0,{dx:0});
    // dos líneas que cambian de posición: paralelas -> cruzadas -> en V
    ctx.save();ctx.strokeStyle=C.cacao;ctx.lineWidth=8;ctx.lineCap='round';ctx.globalAlpha=P(u,0.2,0.5);
    const ph=P(u,0.9,2.4)*3,a=ph%1,st=Math.floor(ph);const pos=[[[-180,-180],[180,180]],[[-180,180],[180,-180]],[[-60,-60],[60,60]]];
    const A=pos[st%3],B=pos[(st+1)%3],e=eIOC(a);for(let i=0;i<2;i++){const tx=lerp(A[i][0],B[i][0],e),bx=lerp(A[i][1],B[i][1],e);
      ctx.beginPath();ctx.moveTo(W/2+tx,920);ctx.lineTo(W/2+bx,1180);ctx.stroke()}ctx.restore();
    line(1,1.4,y0+140,{c:C.cacao});line(2,2.1,1340,{it:1,size:80});
  }else if(g==='patron'){
    line(0,0.1,y0);
    // patrón decorativo que se dibuja
    const k=P(u,0.5,1.8);ctx.save();ctx.strokeStyle=C.cacao;ctx.lineWidth=4;ctx.globalAlpha=0.8;
    for(let r=0;r<3;r++){ctx.beginPath();const y=1000+r*70;for(let x=80;x<80+(W-160)*k;x+=6){const yy=y+Math.abs(Math.sin((x/40)*Math.PI))*-26;x===80?ctx.moveTo(x,yy):ctx.lineTo(x,yy)}ctx.stroke();
      for(let x=100;x<80+(W-160)*k;x+=40){ctx.beginPath();ctx.arc(x,y-30,6,0,7);ctx.stroke()}}ctx.restore();
    line(1,1.3,y0+140,{c:C.cacao});line(2,2.0,1340,{it:1,size:80});
  }else if(g==='calma'){ // categorías sensibles: tono sereno, sin golpes
    line(0,0.2,y0,{size:90});line(1,1.1,y0+140,{c:C.cacao,size:90});line(2,2.0,y0+280,{it:1,size:80});
  }else{ // 'texto': texto cinético estándar
    line(0,0.1,y0);line(1,1.0,y0+140,{c:C.cacao});line(2,1.9,y0+280,{it:1,size:80});
  }
}

// ---------- ESCENA 2: producto + foto completa (sin recortes agresivos)
function hero(t){
  const p=SPEC.p,u=t-T.hero;kicker(eOC(P(u,0,0.4)));
  T_(p.categoria.toUpperCase(),80,360,32,{f:SANS,w:600,ls:5,c:C.cacao,a:eOC(P(u,0.1,0.4))});
  const k=eOX(P(u,0.15,0.55));ctx.save();ctx.globalAlpha=k;T_(p.modelo,80,lerp(500,470,k),fit(p.modelo,W-160,130,{it:1}),{it:1,c:C.ink});ctx.restore();
  const kc=eOB(P(u,0.2,0.75)),cw=720,ch=960,cx=W/2,cy=1060;
  ctx.save();ctx.translate(cx,cy);ctx.scale(lerp(0.7,1,kc),lerp(0.7,1,kc));ctx.globalAlpha=cl(kc*1.5);
  ctx.shadowColor='rgba(43,43,43,.25)';ctx.shadowBlur=60;ctx.shadowOffsetY=24;rr(-cw/2,-ch/2,cw,ch,28);ctx.fillStyle=C.white;ctx.fill();ctx.shadowColor='transparent';
  ctx.save();rr(-cw/2,-ch/2,cw,ch,28);ctx.clip();
  if(IMG){const s=Math.max(cw/IMG.width,ch/IMG.height),iw=IMG.width*s,ih=IMG.height*s;ctx.drawImage(IMG,-iw/2,-ih/2,iw,ih)}
  else{ctx.fillStyle=C.ivory;ctx.fillRect(-cw/2,-ch/2,cw,ch);T_(TX.foto,0,0,40,{f:SANS,w:600,al:'center',c:C.nude})}
  ctx.restore();ctx.restore();
  if(IMG&&SPEC.m.ia&&SPEC.m.ia.mostrar_si_foto)aiLabel(eOC(P(u,0.6,0.9)));
}

// ---------- ESCENA 3: rango (tallas), variantes y colores reales
function talla(t){
  const p=SPEC.p,u=t-T.talla;kicker();
  T_(SPEC.m.etiquetas.rango,80,420,64,{f:SANS,w:600,c:C.cacao,a:eOC(P(u,0,0.3))});
  // tallas: cinta con los números reales
  const tl=p.rango.length?p.rango:['—'];const k=eOX(P(u,0.1,0.8));
  T_(tl.length>1?`${tl[0]}–${tl[tl.length-1]}`:String(tl[0]),80,lerp(640,600,k),190,{w:800,a:k});
  tl.forEach((v,i)=>{const kk=eOB(P(u,0.3+i*0.07,0.6+i*0.07));if(kk<=0)return;const x=80+i*(W-160)/Math.max(tl.length,6);
    ctx.save();ctx.globalAlpha=cl(kk);ctx.fillStyle=C.ink;rr(x,680,(W-160)/Math.max(tl.length,6)-12,74,37);ctx.fill();
    T_(String(v),x+((W-160)/Math.max(tl.length,6)-12)/2,730,32,{f:SANS,w:700,c:C.white,al:'center'});ctx.restore()});
  // variantes
  const kc=eOC(P(u,0.9,1.3))*(p.variantes.length?1:0);ctx.save();ctx.globalAlpha=kc;
  T_(p.variantes.length>1?SPEC.m.etiquetas.variantes_plural:SPEC.m.etiquetas.variantes,80,870,48,{f:SANS,w:600,c:C.cacao});
  T_(p.variantes.length?p.variantes.join(' · '):'—',80,980,110,{w:800});ctx.restore();
  // colores reales con su nombre
  const cols=p.colores,n=cols.length,per=Math.min(5,n),sz=Math.min(150,(W-160)/per-30);
  T_(n===1?TX.un_color:TX.colores.replace('{n}',n),80,1150,48,{f:SANS,w:600,c:C.cacao,a:eOC(P(u,1.3,1.6))});
  cols.forEach((c,i)=>{const st=1.4+i*0.12,kk=eOB(P(u,st,st+0.35));if(kk<=0)return;const r=Math.floor(i/per),q=i%per;
    const x=80+q*(sz+30)+sz/2,y=1270+r*(sz+90);ctx.save();ctx.translate(x,y);ctx.scale(kk,kk);
    const parts=c.split('/');parts.forEach((pc,j)=>{ctx.fillStyle=colHex(pc);ctx.beginPath();ctx.moveTo(0,0);ctx.arc(0,0,sz/2,Math.PI/2+j*2*Math.PI/parts.length,Math.PI/2+(j+1)*2*Math.PI/parts.length);ctx.closePath();ctx.fill()});ctx.beginPath();ctx.arc(0,0,sz/2,0,7);ctx.strokeStyle='rgba(10,10,10,.18)';ctx.lineWidth=2;ctx.stroke();ctx.restore();
    T_(c,x,y+sz/2+44,fit(c,sz+24,28,{f:SANS,w:600}),{f:SANS,w:600,al:'center',c:C.text,a:cl(kk)})});
}

// ---------- ESCENA 4: datos de la ficha
function facts(t){
  const p=SPEC.p,u=t-T.facts;kicker();
  T_(SPEC.m.titulo_datos||TX.datos,80,440,60,{f:SANS,w:600,c:C.cacao,a:eOC(P(u,0,0.3))});
  p.datos.slice(0,3).forEach((d,i)=>{const st=0.2+i*0.55,k=eOX(P(u,st,st+0.45));if(k<=0)return;const y=640+i*270;
    ctx.save();ctx.globalAlpha=k;ctx.translate(lerp(-100,0,k),0);
    ctx.fillStyle=C.nude;ctx.beginPath();ctx.arc(104,y-28,22,0,7);ctx.fill();
    ctx.strokeStyle=C.white;ctx.lineWidth=6;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(93,y-28);ctx.lineTo(101,y-19);ctx.lineTo(116,y-38);ctx.stroke();
    // texto en hasta dos líneas
    const sz=66,words=d.split(' ');let l1='',l2='';for(const w of words){if(!l2&&MW((l1+' '+w).trim(),sz)<W-260)l1=(l1+' '+w).trim();else l2=(l2+' '+w).trim()}
    T_(l1,160,y,fit(l1,W-260,sz),{});if(l2)T_(l2,160,y+80,fit(l2,W-260,sz),{});ctx.restore()});
}

// ---------- ESCENA 5: precio real
function price(t){
  const p=SPEC.p,u=t-T.price;kicker();
  T_(p.modelo,80,760,80,{it:1,c:C.text,a:eOC(P(u,0,0.3))});
  if(p.desde)T_(TX.desde,80,890,58,{f:SANS,w:600,c:C.cacao,a:eOC(P(u,0.05,0.35))});
  const k=eOX(P(u,0.15,0.45)),s=lerp(1.5,1,k);ctx.save();ctx.translate(80,1130);ctx.scale(s,s);T_(p.precio,0,0,fit(p.precio,W-160,280,{w:800}),{w:800,c:C.ink,a:k});ctx.restore();
  if(p.precio_antes){const ka=eOC(P(u,0.5,0.8));T_(p.precio_antes,80,1230,64,{f:SANS,w:600,c:C.text,a:ka*0.6});ctx.save();ctx.globalAlpha=ka;ctx.strokeStyle=C.cacao;ctx.lineWidth=5;ctx.beginPath();ctx.moveTo(76,1208);ctx.lineTo(84+MW(p.precio_antes,64,{f:SANS,w:600}),1208);ctx.stroke();ctx.restore()}
  T_(SPEC.m.precio_nota||'',80,1320,48,{f:SANS,w:600,c:C.cacao,a:eOC(P(u,0.6,0.9))});
}

// ---------- ESCENA 6: cierre de marca
function outro(t){
  const m=SPEC.m,p=SPEC.p,u=t-T.outro,k=eOX(P(u,0,0.45));
  ctx.save();ctx.beginPath();ctx.arc(W/2,960,Math.max(1,k*1500),0,7);ctx.clip();bg(C.ivory);
  if(LOGO){const kl=eOC(P(u,0.15,0.6)),lw=760,lh=LOGO.height*lw/LOGO.width;ctx.save();ctx.globalAlpha=kl;ctx.drawImage(LOGO,W/2-lw/2,560+lerp(30,0,kl),lw,lh);ctx.restore()}
  else{const kl=eOC(P(u,0.15,0.6));T_(m.nombre.toUpperCase(),W/2,820+lerp(30,0,kl),fit(m.nombre.toUpperCase(),W-160,84,{w:700,ls:10}),{w:700,ls:10,al:'center',c:C.cacao,a:kl})}
