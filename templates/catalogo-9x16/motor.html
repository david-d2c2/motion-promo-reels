<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<style>
@font-face{font-family:Play;src:url(fonts/playfair-display-latin-400-normal.woff2);font-weight:400}
@font-face{font-family:Play;src:url(fonts/playfair-display-latin-700-normal.woff2);font-weight:700}
@font-face{font-family:Play;src:url(fonts/playfair-display-latin-800-normal.woff2);font-weight:800}
@font-face{font-family:Play;src:url(fonts/playfair-display-latin-400-italic.woff2);font-weight:400;font-style:italic}
@font-face{font-family:Play;src:url(fonts/playfair-display-latin-700-italic.woff2);font-weight:700;font-style:italic}
@font-face{font-family:Out;src:url(fonts/outfit-latin-400-normal.woff2);font-weight:400}
@font-face{font-family:Out;src:url(fonts/outfit-latin-600-normal.woff2);font-weight:600}
@font-face{font-family:Out;src:url(fonts/outfit-latin-700-normal.woff2);font-weight:700}
@font-face{font-family:Out;src:url(fonts/outfit-latin-800-normal.woff2);font-weight:800}
html,body{margin:0;background:#F8ECE8}canvas{display:block}
</style></head><body>
<canvas id="c" width="1080" height="1920"></canvas>
<script src="variacion.js"></script>
<script>
/* Motor de reels por producto para catálogos (9:16) · v2 con variación.
   window.SPEC = {m: marca, p: producto} lo inyecta render.js. Si el producto trae "plan" (node variar.js), el reel se
   construye según ese plan: orden de escenas, layout de cada escena, transición, tema de color, entrada del texto,
   variante del gancho y tempo. Sin plan, se construye como en la v1.
   Todo es determinista: cada fotograma depende solo de f (no hay aleatoriedad sin semilla ni requestAnimationFrame). */
const cv=document.getElementById('c'),ctx0=cv.getContext('2d');
let ctx=ctx0;
const W=1080,H=1920,FPS=30,DUR=15.5;
const SP=window.SPEC||{m:{nombre:'',colores:{},etiquetas:{}},p:{hook:[],rango:[],variantes:[],colores:[],datos:[],precio:''}};
const PL=(SP.p.plan&&SP.p.plan.v===2)?SP.p.plan:VAR.planBase(SP.p);
const TL=PL.tiempos;
const TH=VAR.tema(SP.m.colores,PL.tema);
const HOOK=(SP.p.hooks&&SP.p.hooks[Math.min(PL.hook||0,SP.p.hooks.length-1)])||SP.p.hook||[];
const BPM=(PL.musica&&PL.musica.bpm)||96;
const SERIF='Play, "Playfair Display", Georgia, serif',SANS='Out, Outfit, "Segoe UI", Arial, sans-serif';

const cl=(x,a=0,b=1)=>Math.min(b,Math.max(a,x)),P=(t,a,b)=>cl((t-a)/(b-a)),lerp=(a,b,k)=>a+(b-a)*k;
const eOC=k=>1-Math.pow(1-k,3),eIOC=k=>k<.5?4*k*k*k:1-Math.pow(-2*k+2,3)/2,eOX=k=>k>=1?1:1-Math.pow(2,-10*k),eIX=k=>k<=0?0:Math.pow(2,10*k-10);
const eOB=k=>{const c1=1.7,c3=c1+1;return 1+c3*Math.pow(k-1,3)+c1*Math.pow(k-1,2)};

function T_(s,x,y,size,o={}){ctx.save();ctx.font=`${o.it?'italic ':''}${o.w??700} ${size}px ${o.f??SERIF}`;
  ctx.letterSpacing=(o.ls??0)+'px';ctx.fillStyle=o.c??TH.fg;ctx.globalAlpha*=(o.a??1);ctx.textAlign=o.al??'left';ctx.textBaseline=o.b??'alphabetic';
  ctx.fillText(s,x,y);const m=ctx.measureText(s).width;ctx.restore();return m}
function MW(s,size,o={}){ctx.save();ctx.font=`${o.it?'italic ':''}${o.w??700} ${size}px ${o.f??SERIF}`;ctx.letterSpacing=(o.ls??0)+'px';const m=ctx.measureText(s).width;ctx.restore();return m}
function fit(s,max,size,o={}){let z=size;while(MW(s,z,o)>max&&z>20)z-=2;return z}
function rr(x,y,w,h,r){ctx.beginPath();ctx.roundRect(x,y,w,h,r)}
// parte una frase en dos líneas que quepan en maxW (la segunda se encoge si hace falta)
function wrap2(s,size,maxW,o={}){const ws=s.split(' ');let a='',b='';for(const w of ws){if(!b&&MW((a+' '+w).trim(),size,o)<=maxW)a=(a+' '+w).trim();else b=(b+' '+w).trim()}return b?[a,b]:[a]}

// nombres de color de la tienda -> muestra. Si no está, gris neutro y se muestra el nombre igual.
const COLORS={'blanco':'#F5F2EC','negro':'#141414','tierra':'#C29A7B','piel':'#D9B79C','nude':'#D9B79C','beige':'#DCC6A8','rosa':'#E7B5B6','rosé':'#E9C6BF','rose':'#E9C6BF',
  'azul marino':'#1E2A44','marino':'#1E2A44','azul':'#3D5A8A','gris':'#9A9A9A','burdeos':'#6B1E2C','granate':'#7A1F2B','rojo':'#B3262F','verde':'#4E6B52','champagne':'#E9D7B9',
  'champán':'#E9D7B9','marfil':'#F3EBDD','crudo':'#EFE6D6','visón':'#A89184','topo':'#8E7F74','malva':'#B48BA6','morado':'#6C4A7D','lila':'#C2A9D1','coral':'#E07A65','turquesa':'#3BAFB0','maquillaje':'#D8B096','alabastro':'#EFE7DC','cava':'#E6D3B3','marrón':'#6B4A35','marron':'#6B4A35','arena':'#D6C2A1','fucsia':'#D0317A','flúor':'#D6F23A','fluor':'#D6F23A'};
const colHex=n=>COLORS[(n||'').toLowerCase().trim()]||'#A9A39C';
const BORDE=VAR.mix(TH.fg,TH.bg,0.55); // borde de las muestras de color: visible también con negro sobre tema oscuro
const textoSobre=hex=>VAR.contraste('#141414',hex)>=VAR.contraste('#FFFFFF',hex)?'#141414':'#FFFFFF';

// Textos fijos de la interfaz: se pueden cambiar con "textos" en config.json (tienda.textos).
const TX=Object.assign({midiendo:'midiendo este reel…',remate:'Este reel mide 15,5 s.',ia:'Imagen generada con IA',foto:'foto pendiente',
  un_color:'1 color',colores:'{n} colores',datos:'Lo que te aporta',desde:'desde',decimal:','},SP.m.textos||{});
let IMG=null,LOGO=null,BLUR=null;
const load=src=>new Promise(r=>{const i=new Image();i.onload=()=>r(i);i.onerror=()=>r(null);i.src=src});
// lienzos auxiliares: escena saliente y entrante durante una transición
const mk=()=>{const c=document.createElement('canvas');c.width=W;c.height=H;return c};
const bufA=mk(),bufB=mk(),cA=bufA.getContext('2d'),cB=bufB.getContext('2d');
window.READY=(async()=>{
  await Promise.all([...document.fonts].map(f=>f.load().catch(()=>null))); // todas las caras: nada de fuentes de reserva en el primer fotograma
  if(window.SPEC){if(SP.p.foto)IMG=await load(SP.p.foto);LOGO=await load(SP.m.logo)}
  if(IMG){ // fondo desenfocado precalculado una sola vez (layout "difuso")
    BLUR=mk();const b=BLUR.getContext('2d'),s=Math.max(W/IMG.width,H/IMG.height)*1.15;b.filter='blur(46px)';
    b.drawImage(IMG,W/2-IMG.width*s/2,H/2-IMG.height*s/2,IMG.width*s,IMG.height*s)}
})();

// ---------- piezas comunes
function bg(c){ctx.fillStyle=c||TH.bg;ctx.fillRect(0,0,W,H)}
function kicker(a=1){ctx.save();ctx.globalAlpha=a;T_(SP.m.nombre.toUpperCase(),80,250,30,{f:SANS,w:600,ls:9,c:TH.acc});ctx.fillStyle=TH.acc2;ctx.fillRect(80,272,70,3);ctx.restore()}
// foto dentro de una caja: 'cover' (rellena, recorta) o 'contain' (entera, sin recortes)
function foto(x,y,w,h,modo='cover'){
  if(!IMG){ctx.fillStyle=VAR.mix(TH.card,TH.acc2,0.12);ctx.fillRect(x,y,w,h);T_(TX.foto,x+w/2,y+h/2,40,{f:SANS,w:600,al:'center',c:'#9C8C80'});return}
  const s=modo==='cover'?Math.max(w/IMG.width,h/IMG.height):Math.min(w/IMG.width,h/IMG.height),iw=IMG.width*s,ih=IMG.height*s;
  ctx.drawImage(IMG,x+(w-iw)/2,y+(h-ih)/2,iw,ih)}
// cinta métrica fija (autorreferencia: el reel se "mide" mientras avanza). Es la firma del lote: no varía.
function tape(t){
  const y=H-170,h=64,k=cl(t/DUR),out=t>=TL[TL.length-1].a;
  ctx.save();ctx.fillStyle='#F3E2C4';rr(-10,y,W+20,h,6);ctx.fill();ctx.strokeStyle='rgba(140,106,79,.35)';ctx.lineWidth=2;ctx.stroke();
  const off=k*DUR*10*18;ctx.beginPath();ctx.rect(0,y,W,h);ctx.clip();
  for(let cm=Math.floor(off/18)-2;cm<(off+W)/18+2;cm++){const x=cm*18-off+60;const big=cm%10===0;
    ctx.fillStyle='#8C6A4F';ctx.fillRect(x,y,2,big?30:(cm%5===0?22:14));
    if(big&&cm>=0)T_(String(cm/10),x+6,y+52,20,{f:SANS,w:600,c:'#8C6A4F'})}
  ctx.restore();
  ctx.save();ctx.fillStyle=out?TH.cierreTinta:TH.fg;ctx.fillRect(60,y-14,4,h+28);ctx.restore();
  const label=t>DUR-1.2?(SP.m.cinta_remate||TX.remate):`${TX.midiendo} ${(t).toFixed(1).replace('.',TX.decimal)} s`;
  T_(label,W-80,y-26,24,{f:SANS,w:600,al:'right',c:out?TH.cierreAcc:TH.acc,a:0.85});
}
function aiLabel(a){ // transparencia (AI Act art. 50) si las fotos llevan personas generadas o modificadas con IA
  ctx.save();ctx.globalAlpha=a;ctx.font=`600 26px ${SANS}`;const s=(SP.m.ia&&SP.m.ia.texto)||TX.ia;const w=ctx.measureText(s).width+44;
  ctx.fillStyle='rgba(10,10,10,.78)';rr(W/2-w/2,1590,w,52,26);ctx.fill();ctx.fillStyle='#FFFFFF';ctx.textAlign='center';ctx.fillText(s,W/2,1625);ctx.restore()}

// ============================================================== GANCHO (gag por categoría)
function hook(u){
  const p=SP.p,L=HOOK,y0=740,g=p.gag;
  // una línea del gancho con la entrada del plan: subir · mascara · letras
  const line=(i,st,y,o={})=>{const s=L[i];if(u<st||!s)return;const it=!!o.it,size=fit(s,W-160,o.size||96,{it}),col=o.c||TH.fg;
    const al=(o.centro||PL.alin!=='izquierda')?'center':'left',x=al==='center'?W/2:80,dy=o.dy||0,dx=o.dx||0;
    const k=eOX(P(u,st,st+0.4));
    if(PL.entrada==='mascara'){ctx.save();ctx.beginPath();ctx.rect(0,y+dy-size*1.05,W,size*1.4);ctx.clip();
      ctx.translate(dx,lerp(size*1.15,0,eOC(P(u,st,st+0.45)))+dy);T_(s,x,y,size,{al,c:col,it,a:o.a??1});ctx.restore();
    }else if(PL.entrada==='letras'){const tw=MW(s,size,{it}),x0=al==='center'?W/2-tw/2:80;
      [...s].forEach((ch,j)=>{if(ch===' ')return;const st2=st+j*0.022,kj=eOB(P(u,st2,st2+0.3));if(kj<=0)return;const xx=x0+MW(s.slice(0,j),size,{it}),cw=MW(ch,size,{it});
        ctx.save();ctx.globalAlpha*=cl(kj*1.6)*(o.a??1);ctx.translate(dx+xx+cw/2,y+dy+lerp(28,0,cl(kj)));T_(ch,0,0,size,{al:'center',c:col,it});ctx.restore()});
    }else{ctx.save();ctx.globalAlpha=k*(o.a??1);ctx.translate(dx,lerp(36,0,k)+dy);T_(s,x,y,size,{al,c:col,it});ctx.restore()}};
  if(g==='quitar'){ // dos aros que se dibujan y salen disparados
    line(0,0.1,y0);
    for(const s of [-1,1]){const kd=eOC(P(u,0.3,0.9)),ko=eIX(P(u,1.05,1.45));const cx=W/2+s*200+s*ko*700,cy=1080-ko*260,r=130;
      ctx.save();ctx.translate(cx,cy);ctx.rotate(s*ko*3);ctx.strokeStyle=TH.acc;ctx.lineWidth=16;ctx.lineCap='round';
      ctx.beginPath();ctx.arc(0,0,r,-Math.PI/2,-Math.PI/2+Math.PI*2*kd);ctx.stroke();ctx.restore()}
    line(1,1.1,y0+140,{c:TH.acc,size:110});line(2,1.9,1300,{it:1,size:78});
  }else if(g==='secuencia'){ // las variantes reales pasan una a una
    line(0,0.1,y0);
    const cops=p.variantes.length?p.variantes:['—'];const n=cops.length;const i=Math.min(n-1,Math.floor(P(u,0.9,2.0)*n));
    if(u>0.9){const kk=eOB(P(u,0.9+i*1.1/n,0.9+(i+0.6)*1.1/n));ctx.save();ctx.translate(W/2,1110);ctx.scale(kk,kk);
      T_(cops[i],0,0,300,{al:'center',c:TH.acc,w:800});ctx.restore();
      cops.forEach((c,j)=>T_(c,W/2+(j-(n-1)/2)*90,1230,52,{f:SANS,w:700,al:'center',c:j<=i?TH.fg:VAR.mix(TH.fg,TH.bg,0.8)}))}
    line(1,2.1,1380,{it:1,size:82});
  }else if(g==='cortar'){ // dos hilos sujetan el texto... y se cortan
    const cut=eIX(P(u,0.95,1.25));
    for(const s of [-1,1]){ctx.save();ctx.strokeStyle=TH.acc;ctx.lineWidth=6;ctx.globalAlpha=P(u,0.1,0.4);const x=W/2+s*300;
      ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,lerp(y0-70,-40,cut));ctx.stroke();ctx.restore()}
    const settle=u>1.25?Math.sin((u-1.25)*14)*10*Math.exp(-(u-1.25)*5):0;
    line(0,0.1,y0,{dy:settle});line(1,1.35,y0+150,{c:TH.acc});line(2,2.0,1300,{it:1,size:80});
  }else if(g==='elevar'){
    const lift=eOB(P(u,0.9,1.4));
    ctx.save();ctx.globalAlpha=0.5*P(u,0.6,0.9)*(1-P(u,1.4,1.8));ctx.fillStyle=TH.acc2;ctx.beginPath();ctx.ellipse(W/2,y0+40-lift*10,lerp(260,380,lift),lerp(12,40,lift),0,0,7);ctx.fill();ctx.restore();
    line(0,0.1,y0-lift*90,{size:lerp(96,104,lift)});line(1,1.5,y0+200,{c:TH.acc});line(2,2.1,1300,{it:1,size:82});
  }else if(g==='ritmo'){ // las palabras caen al tempo de la música del plan (audio.py usa el mismo BPM)
    const words=(L[0]||'').split(' ');const sz=fit(L[0]||'',W-160,100);const tw=MW(L[0]||'',sz);let x=W/2-tw/2;
    words.forEach((w,i)=>{const st=0.1+i*(60/BPM)*0.5,k=eOB(P(u,st,st+0.2));ctx.save();ctx.translate(x+MW(w,sz)/2,y0);ctx.scale(k,k);T_(w,0,0,sz,{al:'center'});ctx.restore();x+=MW(w+' ',sz)});
    line(1,1.3,y0+150,{c:TH.acc,size:110,centro:1});line(2,2.0,1300,{it:1,size:80,centro:1});
  }else if(g==='reordenar'){
    line(0,0.1,y0);
    ctx.save();ctx.strokeStyle=TH.acc;ctx.lineWidth=8;ctx.lineCap='round';ctx.globalAlpha=P(u,0.2,0.5);
    const ph=P(u,0.9,2.4)*3,a=ph%1,st=Math.floor(ph);const pos=[[[-180,-180],[180,180]],[[-180,180],[180,-180]],[[-60,-60],[60,60]]];
    const A=pos[st%3],B=pos[(st+1)%3],e=eIOC(a);for(let i=0;i<2;i++){const tx=lerp(A[i][0],B[i][0],e),bx=lerp(A[i][1],B[i][1],e);
      ctx.beginPath();ctx.moveTo(W/2+tx,920);ctx.lineTo(W/2+bx,1180);ctx.stroke()}ctx.restore();
    line(1,1.4,y0+140,{c:TH.acc});line(2,2.1,1340,{it:1,size:80});
  }else if(g==='patron'){ // patrón decorativo que se dibuja
    line(0,0.1,y0);
    const k=P(u,0.5,1.8);ctx.save();ctx.strokeStyle=TH.acc;ctx.lineWidth=4;ctx.globalAlpha=0.8;
    for(let r=0;r<3;r++){ctx.beginPath();const y=1000+r*70;for(let x=80;x<80+(W-160)*k;x+=6){const yy=y+Math.abs(Math.sin((x/40)*Math.PI))*-26;x===80?ctx.moveTo(x,yy):ctx.lineTo(x,yy)}ctx.stroke();
      for(let x=100;x<80+(W-160)*k;x+=40){ctx.beginPath();ctx.arc(x,y-30,6,0,7);ctx.stroke()}}ctx.restore();
    line(1,1.3,y0+140,{c:TH.acc});line(2,2.0,1340,{it:1,size:80});
  }else if(g==='calma'){ // categorías sensibles: tono sereno, sin golpes
    line(0,0.2,y0,{size:90});line(1,1.1,y0+140,{c:TH.acc,size:90});line(2,2.0,y0+280,{it:1,size:80});
  }else{ // 'texto': texto cinético
    line(0,0.1,y0);line(1,1.0,y0+140,{c:TH.acc});line(2,1.9,y0+280,{it:1,size:80});
  }
}

// ============================================================== PRODUCTO (3 layouts)
const HERO={
  tarjeta(u){ // tarjeta blanca con la foto completa y rebote (v1)
    const p=SP.p;kicker(eOC(P(u,0,0.4)));
    T_(p.categoria.toUpperCase(),80,360,32,{f:SANS,w:600,ls:5,c:TH.acc,a:eOC(P(u,0.1,0.4))});
    const k=eOX(P(u,0.15,0.55));ctx.save();ctx.globalAlpha=k;T_(p.modelo,80,lerp(500,470,k),fit(p.modelo,W-160,130,{it:1}),{it:1});ctx.restore();
    const kc=eOB(P(u,0.2,0.75)),cw=720,ch=960;
    ctx.save();ctx.translate(W/2,1060);ctx.scale(lerp(0.7,1,kc),lerp(0.7,1,kc));ctx.globalAlpha=cl(kc*1.5);
    ctx.shadowColor='rgba(20,15,10,.28)';ctx.shadowBlur=60;ctx.shadowOffsetY=24;rr(-cw/2,-ch/2,cw,ch,28);ctx.fillStyle=TH.card;ctx.fill();ctx.shadowColor='transparent';
    ctx.save();rr(-cw/2,-ch/2,cw,ch,28);ctx.clip();foto(-cw/2,-ch/2,cw,ch,'cover');ctx.restore();ctx.restore();
  },
  difuso(u,d){ // la propia foto, desenfocada, hace de fondo; delante, la foto ENTERA (contain) y el nombre en una banda
    const p=SP.p;
    if(BLUR){ctx.save();ctx.globalAlpha=(TH.nombre==="claro"?0.32:0.12)*eOC(P(u,0,0.5));ctx.drawImage(BLUR,0,0);ctx.restore()} // resplandor de la foto sobre el color del tema (el tema manda)
    else{const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,TH.bg);g.addColorStop(1,VAR.mix(TH.bg,TH.acc2,0.35));ctx.fillStyle=g;ctx.fillRect(0,0,W,H)}
    kicker(eOC(P(u,0,0.4)));
    const ke=eOC(P(u,0.05,0.6)),kb=lerp(1.06,1,eOC(P(u,0,d)));
    ctx.save();ctx.globalAlpha=ke;ctx.translate(W/2,840);ctx.scale(kb,kb);ctx.translate(0,lerp(40,0,ke));
    ctx.shadowColor='rgba(20,15,10,.30)';ctx.shadowBlur=50;ctx.shadowOffsetY=20;
    if(IMG)foto(-460,-500,920,1000,'contain');else{rr(-380,-470,760,940,28);ctx.fillStyle=TH.card;ctx.fill();ctx.shadowColor='transparent';ctx.save();rr(-380,-470,760,940,28);ctx.clip();foto(-380,-470,760,940);ctx.restore()}
    ctx.restore();
    const kn=eOX(P(u,0.35,0.8));ctx.save();ctx.fillStyle=TH.bg;ctx.globalAlpha=0.94;ctx.fillRect(0,1380,W*kn,210);ctx.restore();
    T_(p.categoria.toUpperCase(),80,1446,30,{f:SANS,w:600,ls:5,c:TH.acc,a:eOC(P(u,0.5,0.8))});
    ctx.save();ctx.globalAlpha=eOC(P(u,0.55,0.9));T_(p.modelo,lerp(120,80,eOC(P(u,0.55,0.9))),1548,fit(p.modelo,W-160,116,{it:1}),{it:1});ctx.restore();
  },
  arco(u){ // marco en arco que se traza; la foto entera aparece dentro
    const p=SP.p;kicker(eOC(P(u,0,0.4)));
    T_(p.categoria.toUpperCase(),W/2,370,30,{f:SANS,w:600,ls:6,c:TH.acc,al:'center',a:eOC(P(u,0.1,0.4))});
    const w=740,top=430,bot=1330,cx=W/2,r=w/2;
    const path=()=>{ctx.beginPath();ctx.moveTo(cx-r,bot);ctx.lineTo(cx-r,top+r);ctx.arc(cx,top+r,r,Math.PI,0);ctx.lineTo(cx+r,bot);ctx.closePath()};
    const kf=eOC(P(u,0.35,0.85));ctx.save();ctx.globalAlpha=kf;path();ctx.fillStyle=TH.card;ctx.fill();path();ctx.clip();
    ctx.translate(0,lerp(70,0,kf));foto(cx-r+30,top+30,w-60,bot-top-60,IMG?'contain':'cover');ctx.restore();
    const len=2*(bot-top-r)+Math.PI*r+w,kd=eIOC(P(u,0.05,0.8));
    ctx.save();ctx.strokeStyle=TH.acc2;ctx.lineWidth=8;ctx.setLineDash([len*kd,len]);path();ctx.stroke();ctx.restore();
    const k=eOX(P(u,0.6,1.0));ctx.save();ctx.globalAlpha=k;T_(p.modelo,W/2,lerp(1490,1460,k),fit(p.modelo,W-160,118,{it:1}),{it:1,al:'center'});ctx.restore();
  },
};

// ============================================================== SURTIDO: rango, variantes y colores reales (3 layouts)
const RANGO={
  pildoras(u){ // v1

  if(k==='barrido')return{k,pre:0.16,post:0.16};
  return{k,pre:0.14,post:0.32};
}
function compone(kind,k,j){
  const A=bufA,B=bufB,x=ctx0;x.save();
  if(kind==='barrido'){const col=fondoDe(TL[j]);x.drawImage(k<0.5?A:B,0,0);x.globalAlpha=(k<0.5?k/0.5:(1-k)/0.5)*0.92;x.fillStyle=col;x.fillRect(0,0,W,H)}
  else if(kind==='fundido'){x.drawImage(A,0,0);x.globalAlpha=eIOC(k);x.drawImage(B,0,0)}
  else if(kind==='empuje'){const e=eIOC(k);if(j%2){x.drawImage(A,0,-H*e);x.drawImage(B,0,H*(1-e))}else{x.drawImage(A,-W*e,0);x.drawImage(B,W*(1-e),0)}}
  else if(kind==='iris'){const e=PL.base?eOX(k):eIOC(k),R=Math.max(1,e*Math.hypot(W,H)*0.62),cy=PL.base?960:H*0.48;x.drawImage(A,0,0);
    x.save();x.beginPath();x.arc(W/2,cy,R,0,7);x.clip();x.drawImage(B,0,0);x.restore();
    if(!PL.base){x.globalAlpha=1-k;x.strokeStyle=TH.acc;x.lineWidth=12;x.beginPath();x.arc(W/2,cy,R,0,7);x.stroke()}}
  else if(kind==='diagonal'){const e=eIOC(k),s=0.45,X=e*(W+H*s);x.drawImage(A,0,0);
    const poly=()=>{x.beginPath();x.moveTo(0,0);x.lineTo(X,0);x.lineTo(X-H*s,H);x.lineTo(0,H);x.closePath()};
    x.save();poly();x.clip();x.drawImage(B,0,0);x.restore();
    x.strokeStyle=TH.acc;x.lineWidth=22;x.globalAlpha=Math.sin(Math.PI*k);x.beginPath();x.moveTo(X,0);x.lineTo(X-H*s,H);x.stroke()}
  else if(kind==='persiana'){const n=8,h=H/n;x.drawImage(A,0,0);x.save();x.beginPath();
    for(let i=0;i<n;i++){const w=W*eIOC(P(k,i*0.05,i*0.05+0.6));if(i%2)x.rect(W-w,i*h,w,h+1);else x.rect(0,i*h,w,h+1)}
    x.clip();x.drawImage(B,0,0);x.restore()}
  else if(kind==='zoom'){const e=eIOC(k);x.fillStyle=fondoDe(TL[j]);x.fillRect(0,0,W,H);
    x.save();x.globalAlpha=1-e;x.translate(W/2,H/2);x.scale(1+0.18*e,1+0.18*e);x.drawImage(A,-W/2,-H/2);x.restore();
    x.save();x.globalAlpha=e;x.translate(W/2,H/2);x.scale(lerp(0.92,1,e),lerp(0.92,1,e));x.drawImage(B,-W/2,-H/2);x.restore()}
  else x.drawImage(k<1?A:B,0,0);
  x.restore();
}

function renderFrame(f){
  const t=f/FPS;ctx=ctx0;ctx.setTransform(1,0,0,1,0,0);ctx.globalAlpha=1;
  let j=TL.findIndex(s=>t<s.b);if(j<0)j=TL.length-1;
  let c=null;
  if(j>0){const q=corte(j);if(t<TL[j].a+q.post)c=j}
  if(c===null&&j+1<TL.length){const q=corte(j+1);if(q.pre>0&&t>=TL[j+1].a-q.pre)c=j+1}
  if(c!==null){const q=corte(c),A=TL[c-1],B=TL[c],k=P(t,B.a-q.pre,B.a+q.post);pinta(cA,A,t);pinta(cB,B,t);compone(q.k,k,c)}
  else pinta(ctx0,TL[j],t);
  ctx=ctx0;tape(t);
  if(t>DUR-0.35){ctx.save();ctx.globalAlpha=P(t,DUR-0.35,DUR);ctx.fillStyle=TH.cierre;ctx.fillRect(0,0,W,H);ctx.restore()}
}
window.renderFrame=renderFrame;window.TOTAL=Math.round(DUR*FPS);window.PLAN=PL;
</script></body></html>
