name: Package skill

# Builds motion-promo-reels.zip with the layout claude.ai expects
# (top-level folder named exactly like the skill) and publishes it as the "latest" release.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: motion-promo-reels

      - name: Check shared files are in sync
        # variacion.js, variar.js y hoja.py son comunes a las tres plantillas; render.js, a las dos 9:16
        run: |
          cd motion-promo-reels/templates
          for f in variacion.js variar.js hoja.py; do
            cmp catalogo-9x16/$f producto-9x16/$f && cmp catalogo-9x16/$f persona-16x9/$f || { echo "$f differs between templates"; exit 1; }
          done
          cmp catalogo-9x16/render.js producto-9x16/render.js || { echo "render.js differs between 9:16 templates"; exit 1; }

      - name: Build zip
        run: |
          rm -rf motion-promo-reels/.git motion-promo-reels/.github motion-promo-reels/install.sh motion-promo-reels/install.ps1
          zip -qr motion-promo-reels.zip motion-promo-reels
          unzip -l motion-promo-reels.zip | grep -q "motion-promo-reels/SKILL.md"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release delete latest --cleanup-tag --yes || true
          gh release create latest motion-promo-reels.zip \
            --target "${{ github.sha }}" \
            --title "motion-promo-reels (latest)" \
            --notes "Ready-to-upload skill package for claude.ai. Built automatically from ${{ github.sha }}." \
            --latest
