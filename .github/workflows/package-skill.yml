name: Package skill

# Builds motion-promo-reels.zip with the layout claude.ai expects
# (top-level folder named exactly like the skill) and publishes it as the "latest" release.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: motion-promo-reels

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Check the engine and the templates
        # v3.3: el motor común vive una sola vez en core/. Se crea un proyecto con cada plantilla y se comprueba
        # que arranca: datos, planes de variación y hoja de contactos. Sin npm install: comprobar.js --datos
        # no necesita Chrome; el render completo se prueba a mano antes de publicar.
        run: |
          cd motion-promo-reels
          for f in templates/*/{variacion.js,variar.js,hoja.py,sonido.py,voz.js,comprobar.js} templates/*-9x16/render.js; do
            if [ -e "$f" ]; then echo "$f is a core file: keep it only in core/"; exit 1; fi
          done
          pip install -q numpy scipy pillow
          for t in catalogo producto persona; do
            node core/nuevo.js $t /tmp/p-$t
            (cd /tmp/p-$t && node comprobar.js --datos && if [ $t = persona ]; then node variar.js 3; else node variar.js; fi)
          done
          py=$(python3 -c "import ast;t=ast.parse(open('core/comun/sonido.py').read());n=[x for x in t.body if isinstance(x,ast.Assign) and getattr(x.targets[0],'id','')=='ESTILOS'][0];print(','.join(sorted(k.value for k in n.value.keys)))")
          js=$(node -e "console.log(Object.keys(require('./core/comun/variacion.js').ESTILOS).sort().join(','))")
          [ "$py" = "$js" ] || { echo "music styles differ: sonido.py=$py variacion.js=$js"; exit 1; }

      - name: Build zip
        run: |
          rm -rf motion-promo-reels/.git motion-promo-reels/.github motion-promo-reels/install.sh motion-promo-reels/install.ps1
          zip -qr motion-promo-reels.zip motion-promo-reels
          unzip -l motion-promo-reels.zip | grep -q "motion-promo-reels/SKILL.md"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release delete latest --cleanup-tag --yes || true
          gh release create latest motion-promo-reels.zip \
            --target "${{ github.sha }}" \
            --title "motion-promo-reels (latest)" \
            --notes "Ready-to-upload skill package for claude.ai. Built automatically from ${{ github.sha }}." \
            --latest
